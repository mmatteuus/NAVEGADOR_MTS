name: QA Windows e instalador
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sintaxe:
    name: Sintaxe e extensão (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q src entrypoint.py stdio_entrypoint.py
      - run: node tests/run_extension_suite.mjs
  contratos:
    name: Testes de contrato MCP (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências do projeto
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Compilação de sintaxe
        run: python -m compileall -q src entrypoint.py stdio_entrypoint.py
      - name: Testes MCP, segurança e atualização
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Diagnóstico público dos testes
        if: ${{ always() }}
        run: python report_test_failures.py test-results.xml
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.xml
          retention-days: 3
      - name: Testes adversariais da extensão MV3
        run: node tests/run_extension_suite.mjs
  e2e_conector:
    name: Diagnóstico manual de recarga (Chromium descartável)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências Python da bridge de QA
        run: python -m pip install -r requirements.txt
      - name: Playwright Chromium fixado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --prefix temp/qa-node playwright@1.63.0 --no-save --package-lock=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --prefix temp/qa-node playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $module = (Resolve-Path 'temp/qa-node/node_modules/playwright').Path
          "PLAYWRIGHT_MODULE=$module" >> $env:GITHUB_ENV
          "QA_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          "QA_RUN_REAL_E2E=1" >> $env:GITHUB_ENV
      - name: Executar E2E real do conector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force temp | Out-Null
          node tests/e2e_real/test_connector_popup_update.mjs 2>&1 | Tee-Object -FilePath temp/connector-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Artefatos E2E
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-connector-e2e
          path: temp/connector-e2e.log
          if-no-files-found: error
          retention-days: 3
  instalador:
    name: Compilar instalador Windows para teste
    needs: contratos
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de compilação
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Gerar ícone
        run: python generate_icon.py
      - name: Compilar desktop e auxiliar MCP
        run: python build_exe.py
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Gerar instalador
        run: python build_installer.py
      - name: Validar caminho do instalador canônico
        id: installer
        shell: pwsh
        run: |
          $version = (python -c "from src.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Fonte canônica de versão vazia." }
          $installer = "dist_installer/NAVEGADOR_MTS_Instalador_v$version.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Instalador canônico ausente: $installer" }
          "path=$installer" >> $env:GITHUB_OUTPUT
      - name: Publicar instalador para testes
        uses: actions/upload-artifact@v4
        with:
          name: Navegador-MTS-Windows-Teste
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
  release:
    name: Release versionada de main
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [sintaxe, contratos]
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências e versão efêmera
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          $base = (python -c "from src.version import APP_VERSION; print(APP_VERSION)").Trim()
          python prepare_release.py --base-version $base --run-number $env:GITHUB_RUN_NUMBER --commit $env:GITHUB_SHA --metadata release-metadata.json
      - name: Compilar instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          python generate_icon.py
          python build_exe.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          python build_installer.py
      - name: Validar digest e identidade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $meta = Get-Content release-metadata.json | ConvertFrom-Json
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "Checkout diverge de GITHUB_SHA." }
          $installer = Join-Path $PWD "dist_installer\$($meta.asset)"
          if (!(Test-Path -LiteralPath $installer)) { throw "Asset ausente: $($meta.asset)" }
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($meta.asset)" | Set-Content -Encoding ascii "dist_installer\$($meta.checksum_asset)"
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) { throw "Digest instável." }
          "version=$($meta.version)" >> $env:GITHUB_OUTPUT
      - name: Publicar release imutável
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          python publish_release.py --metadata release-metadata.json --installer-dir dist_installer --repository $env:GITHUB_REPOSITORY
